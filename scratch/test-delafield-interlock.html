<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Align M of Moment with T of BEST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .card {
      width: 390px;
      background: #4A0808;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      border-radius: 8px;
    }

    .label {
      color: #D4AF37;
      font-size: 13px;
      font-family: sans-serif;
      margin-bottom: 15px;
    }

    /* Option A: Inline flow with absolute or relative overlap */
    .heading-A {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
    }
    .heading-A .best {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #FFFFFF;
      text-transform: uppercase;
      margin-right: 90px; /* Đẩy mạnh BEST sang trái */
    }
    .heading-A .moment {
      font-family: 'Mrs Saint Delafield', cursive;
      font-size: 60px;
      font-weight: 400;
      font-style: normal;
      color: #FFFFFF;
      line-height: 0.8;
      margin-top: -20px;
      margin-left: 90px; /* Đẩy mạnh Moment sang phải để M chạm T */
    }

    /* Option B: Inline-block layout where BEST and Moment are positioned relative to T */
    .heading-B {
      position: relative;
      display: inline-block;
      text-align: left;
      padding-bottom: 25px;
    }
    .heading-B .best {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #FFFFFF;
      text-transform: uppercase;
      display: inline-block;
    }
    .heading-B .moment {
      font-family: 'Mrs Saint Delafield', cursive;
      font-size: 62px;
      font-weight: 400;
      font-style: normal;
      color: #FFFFFF;
      position: absolute;
      left: 78px; /* Bắt đầu ngay tại chữ T của BEST (BES rộng ~78px) */
      top: 14px;  /* Lồng nhẹ dưới chân T */
      white-space: nowrap;
      line-height: 1;
    }

    /* Option C: Fine-tuned Option B with left: 70px (chữ M lồng xuyên qua chữ T) */
    .heading-C {
      position: relative;
      display: inline-block;
      text-align: left;
      padding-bottom: 25px;
    }
    .heading-C .best {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #FFFFFF;
      text-transform: uppercase;
      display: inline-block;
    }
    .heading-C .moment {
      font-family: 'Mrs Saint Delafield', cursive;
      font-size: 60px;
      font-weight: 400;
      font-style: normal;
      color: #FFFFFF;
      position: absolute;
      left: 68px; /* M lồng qua chữ T */
      top: 16px;
      white-space: nowrap;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="label">Option A: Flex shift (margin-right: 90px, margin-left: 90px)</div>
    <div class="heading-A">
      <span class="best">BEST</span>
      <span class="moment">Moment</span>
    </div>
  </div>

  <div class="card">
    <div class="label">Option B: Positioned right at T (left: 78px, top: 14px)</div>
    <div class="heading-B">
      <span class="best">BEST</span>
      <span class="moment">Moment</span>
    </div>
  </div>

  <div class="card">
    <div class="label">Option C: M interlocks through T (left: 68px, top: 16px)</div>
    <div class="heading-C">
      <span class="best">BEST</span>
      <span class="moment">Moment</span>
    </div>
  </div>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="qrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDFBF9" />
    </linearGradient>
  </defs>

  <!-- Nền QR -->
  <rect width="300" height="300" rx="16" fill="url(#qrBg)" stroke="#E5D7CE" stroke-width="2"/>

  <!-- Corner Position Detectors (Top-Left) -->
  <rect x="25" y="25" width="60" height="60" rx="8" fill="#4A0808"/>
  <rect x="33" y="33" width="44" height="44" rx="4" fill="#FFFFFF"/>
  <rect x="41" y="41" width="28" height="28" rx="3" fill="#4A0808"/>

  <!-- Corner Position Detectors (Top-Right) -->
  <rect x="215" y="25" width="60" height="60" rx="8" fill="#4A0808"/>
  <rect x="223" y="33" width="44" height="44" rx="4" fill="#FFFFFF"/>
  <rect x="231" y="41" width="28" height="28" rx="3" fill="#4A0808"/>

  <!-- Corner Position Detectors (Bottom-Left) -->
  <rect x="25" y="215" width="60" height="60" rx="8" fill="#4A0808"/>
  <rect x="33" y="223" width="44" height="44" rx="4" fill="#FFFFFF"/>
  <rect x="41" y="231" width="28" height="28" rx="3" fill="#4A0808"/>

  <!-- Stylized QR Grid Data Dots (Burgundy theme) -->
  <g fill="#4A0808">
    <!-- Top area patterns -->
    <rect x="100" y="25" width="12" height="12" rx="2"/>
    <rect x="120" y="25" width="12" height="24" rx="2"/>
    <rect x="140" y="35" width="20" height="12" rx="2"/>
    <rect x="170" y="25" width="12" height="12" rx="2"/>
    <rect x="190" y="35" width="12" height="24" rx="2"/>

    <rect x="95" y="50" width="18" height="12" rx="2"/>
    <rect x="130" y="55" width="12" height="12" rx="2"/>
    <rect x="155" y="55" width="25" height="12" rx="2"/>

    <!-- Left & Right mid columns -->
    <rect x="25" y="100" width="12" height="24" rx="2"/>
    <rect x="45" y="100" width="24" height="12" rx="2"/>
    <rect x="45" y="120" width="12" height="24" rx="2"/>
    <rect x="75" y="100" width="12" height="12" rx="2"/>
    <rect x="25" y="140" width="24" height="12" rx="2"/>
    <rect x="65" y="130" width="20" height="24" rx="2"/>
    <rect x="30" y="165" width="15" height="15" rx="2"/>
    <rect x="60" y="165" width="25" height="15" rx="2"/>

    <rect x="215" y="100" width="24" height="12" rx="2"/>
    <rect x="250" y="100" width="24" height="24" rx="2"/>
    <rect x="220" y="125" width="12" height="24" rx="2"/>
    <rect x="245" y="135" width="20" height="12" rx="2"/>
    <rect x="215" y="160" width="30" height="12" rx="2"/>
    <rect x="255" y="160" width="15" height="25" rx="2"/>

    <!-- Center clusters -->
    <rect x="100" y="80" width="12" height="20" rx="2"/>
    <rect x="125" y="80" width="20" height="12" rx="2"/>
    <rect x="155" y="80" width="12" height="24" rx="2"/>
    <rect x="180" y="80" width="20" height="12" rx="2"/>

    <rect x="100" y="110" width="24" height="12" rx="2"/>
    <rect x="175" y="105" width="25" height="15" rx="2"/>

    <rect x="100" y="170" width="15" height="25" rx="2"/>
    <rect x="130" y="175" width="20" height="12" rx="2"/>
    <rect x="160" y="170" width="15" height="25" rx="2"/>
    <rect x="185" y="175" width="18" height="12" rx="2"/>

    <!-- Bottom area patterns -->
    <rect x="100" y="215" width="24" height="12" rx="2"/>
    <rect x="135" y="215" width="12" height="24" rx="2"/>
    <rect x="160" y="215" width="25" height="12" rx="2"/>
    <rect x="200" y="215" width="12" height="12" rx="2"/>
    <rect x="225" y="215" width="20" height="12" rx="2"/>
    <rect x="255" y="215" width="15" height="25" rx="2"/>

    <rect x="100" y="240" width="12" height="25" rx="2"/>
    <rect x="125" y="250" width="25" height="15" rx="2"/>
    <rect x="165" y="240" width="15" height="25" rx="2"/>
    <rect x="195" y="240" width="25" height="12" rx="2"/>
    <rect x="230" y="240" width="35" height="12" rx="2"/>
    <rect x="205" y="260" width="20" height="15" rx="2"/>
    <rect x="240" y="260" width="25" height="15" rx="2"/>
  </g>

  <!-- Center Watermark / Logo Shield for DEMO -->
  <rect x="95" y="125" width="110" height="50" rx="8" fill="#FFFDF8" stroke="#C8A366" stroke-width="2"/>
  <rect x="99" y="129" width="102" height="42" rx="6" fill="#4A0808"/>
  <text x="150" y="147" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#F4E8D3" text-anchor="middle" letter-spacing="1.5">DEMO QR</text>
  <text x="150" y="161" font-family="'Montserrat', sans-serif" font-size="8" font-weight="500" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">KHÔNG CHUYỂN TIỀN</text>
</svg>


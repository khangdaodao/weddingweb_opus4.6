<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <!-- Cụm hoa trang trí góc trên bên trái của khối vòm sự kiện -->
  <g transform="translate(10, 10)">
    <!-- Lá cây màu xanh rêu sẫm -->
    <path d="M40 70 C15 50 10 15 45 15 C75 15 70 50 40 70 Z" fill="#2E4A28" opacity="0.85"/>
    <path d="M70 30 C95 10 130 15 125 45 C120 75 90 60 70 30 Z" fill="#3D5C35" opacity="0.85"/>
    <path d="M20 105 C5 80 20 50 50 60 C55 90 40 105 20 105 Z" fill="#2E4A28" opacity="0.8"/>

    <!-- Hoa mẫu đơn lớn màu đỏ maroon sẫm -->
    <circle cx="85" cy="85" r="42" fill="#4A0808"/>
    <circle cx="82" cy="82" r="35" fill="#5C0E0E"/>
    <path d="M58 72 C62 58 102 55 112 72 C118 88 98 108 78 108 C58 108 52 88 58 72 Z" fill="#751515"/>
    <circle cx="85" cy="85" r="9" fill="#D4AF37" opacity="0.85"/>

    <!-- Hoa phụ màu hồng phấn (dusty rose) -->
    <g transform="translate(90, 45)">
      <circle cx="22" cy="22" r="22" fill="#C97575"/>
      <circle cx="22" cy="22" r="16" fill="#E29696"/>
      <circle cx="22" cy="22" r="10" fill="#F0B8B8"/>
      <circle cx="22" cy="22" r="4" fill="#D4AF37"/>
    </g>

    <!-- Nụ hoa phụ -->
    <circle cx="35" cy="115" r="13" fill="#8C1D1D"/>
    <circle cx="33" cy="113" r="8" fill="#B32B2B"/>
  </g>
</svg>

